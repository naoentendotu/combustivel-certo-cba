<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Combustível Certo · Cuiabá-MT</title>
    <meta name="description" content="Preços de gasolina, etanol e diesel nos postos de Cuiabá-MT, pela pesquisa semanal da ANP." />
    <meta name="theme-color" content="#ffffff" />

    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="apple-touch-icon" href="assets/logo-icon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/app.css?v=4" />
  </head>

  <body>
    <div class="app-root">
      <!-- Mapa (tela inicial) -->
      <section id="viewMap" class="view-panel" aria-label="Mapa de postos">
        <div class="map-top">
          <div class="map-bar">
            <img src="assets/logo-icon.svg" alt="Combustível Certo" />
            <div id="mapFloatingFuels"></div>
          </div>
          <button id="top10QuickBtn" type="button" class="map-chip">
            <i data-lucide="trending-up"></i>
            <span>10 mais baratos</span>
          </button>
        </div>

        <div id="map" class="map-canvas"></div>

        <div id="mapStatus" class="map-status hidden" role="status"></div>

        <button
          id="floatingGpsBtn"
          type="button"
          class="floating-gps-btn"
          aria-label="Ir para a minha localização"
          title="Minha localização"
        >
          <i data-lucide="locate-fixed"></i>
        </button>

        <div id="sheetBackdrop" class="sheet-backdrop is-hidden"></div>
        <div id="bottomSheet" class="bottom-sheet is-hidden"></div>
      </section>

      <!-- Lista -->
      <section id="viewList" class="view-panel is-hidden scroll-thin" style="overflow-y: auto" aria-label="Lista de postos"></section>

      <!-- Pesquisa ANP (todos os registros) -->
      <section id="viewDados" class="view-panel is-hidden" style="display: flex; flex-direction: column" aria-label="Pesquisa de preços da ANP">
        <header class="page-head">
          <div class="page-inner dados-wide dados-head">
            <div>
              <h1 class="page-title">Pesquisa de preços da ANP</h1>
              <p id="tabMeta" class="page-sub">Registros da pesquisa semanal em Cuiabá</p>
            </div>
            <button id="tabReloadBtn" type="button" class="btn-icon" aria-label="Atualizar" title="Atualizar">
              <i data-lucide="refresh-cw"></i>
            </button>
          </div>
        </header>

        <div class="dados-filters">
          <div class="page-inner dados-wide">
            <div class="dados-grid">
              <label class="field"><span>Combustível</span><select id="tabCombustivel"></select></label>
              <label class="field"><span>Bairro</span><select id="tabBairro"></select></label>
            </div>

            <div id="tabFiltrosAvancados" class="dados-grid more hidden">
              <label class="field"><span>Bandeira</span><select id="tabBandeira"></select></label>
              <label class="field">
                <span>Período</span>
                <select id="tabSemanas">
                  <option value="1">Semana mais recente</option>
                  <option value="4">Últimas 4 semanas</option>
                  <option value="todas">Todo o histórico</option>
                </select>
              </label>
              <label class="field"><span>Preço mínimo (R$)</span><input id="tabMin" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0,00" /></label>
              <label class="field"><span>Preço máximo (R$)</span><input id="tabMax" type="number" min="0" step="0.01" inputmode="decimal" placeholder="9,99" /></label>
              <label class="field"><span>Coleta a partir de</span><input id="tabDe" type="date" /></label>
              <label class="field"><span>Coleta até</span><input id="tabAte" type="date" /></label>
            </div>

            <div class="dados-tools">
              <button id="tabToggleFiltrosBtn" type="button" class="link" aria-expanded="false" aria-controls="tabFiltrosAvancados">
                <i data-lucide="sliders-horizontal"></i>
                <span>Mais filtros</span>
                <i data-lucide="chevron-down" class="chev"></i>
              </button>
              <button id="tabLimpar" type="button" class="link">Limpar</button>
              <span id="tabTotal" class="count"></span>
            </div>
          </div>
        </div>

        <div class="scroll-thin" style="flex: 1; min-height: 0; overflow-y: auto">
          <div class="page-inner dados-wide" style="padding-top: 14px; padding-bottom: 20px">
            <div id="tabEstado" class="state hidden" role="status"></div>
            <ul id="tabCardsContainer" class="rows sheet-block"></ul>
            <div id="tabTableWrap" class="table-wrap">
              <table id="tabTable" class="table">
                <thead>
                  <tr>
                    <th>Posto</th>
                    <th>Bandeira</th>
                    <th>Combustível</th>
                    <th class="num">Preço</th>
                    <th class="num">Coleta</th>
                    <th><span class="sr-only">Ações</span></th>
                  </tr>
                </thead>
                <tbody id="tabCorpo"></tbody>
              </table>
            </div>
            <p id="tabAviso" class="footnote hidden" style="padding-bottom: 0"></p>
          </div>
        </div>

        <div id="tabPagination" class="dados-foot">
          <div class="page-inner dados-wide pager">
            <span id="tabPagInfo"></span>
            <div class="pager-nav">
              <button id="tabPagPrev" type="button" class="btn-icon" aria-label="Página anterior"><i data-lucide="chevron-left"></i></button>
              <span id="tabPagPage" class="pager-page"></span>
              <button id="tabPagNext" type="button" class="btn-icon" aria-label="Próxima página"><i data-lucide="chevron-right"></i></button>
            </div>
          </div>
        </div>
      </section>

      <nav class="bottom-nav" aria-label="Seções">
        <img class="nav-brand" src="assets/logo-icon.svg" alt="Combustível Certo" />
        <button type="button" data-nav-tab="map" class="nav-tab-btn is-active">
          <i data-lucide="map"></i>
          <span>Mapa</span>
        </button>
        <button type="button" data-nav-tab="list" class="nav-tab-btn">
          <i data-lucide="list"></i>
          <span>Lista</span>
        </button>
        <button type="button" data-nav-tab="dados" class="nav-tab-btn">
          <i data-lucide="table"></i>
          <span>Pesquisa</span>
        </button>
      </nav>
    </div>

    <!-- 10 mais baratos -->
    <div id="modalTop10" class="modal hidden">
      <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="top10Title">
        <header class="modal-head">
          <div>
            <h2 id="top10Title">10 mais baratos</h2>
            <p id="top10Meta"></p>
          </div>
          <button id="top10Close" type="button" class="btn-icon" aria-label="Fechar"><i data-lucide="x"></i></button>
        </header>

        <div class="modal-controls">
          <div id="top10FuelTabs" class="seg" role="group" aria-label="Combustível">
            <button type="button" data-top10-fuel="gasolina" aria-pressed="true">Gasolina</button>
            <button type="button" data-top10-fuel="etanol" aria-pressed="false">Etanol</button>
            <button type="button" data-top10-fuel="diesel" aria-pressed="false">Diesel S10</button>
          </div>
          <div id="top10PeriodoBtns" class="seg" role="group" aria-label="Período do gráfico">
            <button type="button" data-top10-periodo="4" aria-pressed="true">4 semanas</button>
            <button type="button" data-top10-periodo="todas" aria-pressed="false">Todo o histórico</button>
          </div>
        </div>

        <div class="modal-body scroll-thin">
          <dl id="top10Metrics" class="stats"></dl>
          <div id="top10GraficoBox"></div>
          <p id="top10Aviso" class="footnote hidden" style="padding-bottom: 0"></p>
          <p class="modal-foot">
            <button id="top10VerTabelaGeral" type="button" class="link">Ver todos os registros da pesquisa</button>
          </p>
        </div>
      </div>
    </div>
    <div id="grafTip" class="graf-tip hidden"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="js/data/stations-data.js?v=4"></script>
    <script src="js/components/ui.js?v=4"></script>
    <script src="js/components/map-view.js?v=4"></script>
    <script src="js/components/bottom-sheet.js?v=4"></script>
    <script src="js/components/list-view.js?v=4"></script>
    <script src="js/components/modals.js?v=4"></script>
    <script src="js/components/nav.js?v=4"></script>
    <script src="js/app.js?v=4"></script>
  </body>
</html>
