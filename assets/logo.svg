<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 90" width="100%" height="100%">
  <!-- Fundo Escuro do Banner da Logo -->
  <rect width="340" height="90" rx="20" fill="#091e26" />

  <!-- Ícone Esquerdo (Squircle 56x56) -->
  <g transform="translate(18, 17)">
    <!-- Fundo Verde Brasil -->
    <rect width="56" height="56" rx="14" fill="#0e7048" />

    <!-- Losango Amarelo Ouro -->
    <polygon
      points="28,7.5 48.5,28 28,48.5 7.5,28"
      fill="#f5b723"
      stroke="#f5b723"
      stroke-width="2"
      stroke-linejoin="round"
    />

    <!-- Círculo Central Escuro -->
    <circle cx="28" cy="28" r="13" fill="#091e26" />

    <!-- Gota de Combustível Amarela -->
    <path
      d="M 28,17.5 C 28,17.5 35,27 35,31.5 C 35,35.3 31.9,38.5 28,38.5 C 24.1,38.5 21,35.3 21,31.5 C 21,27 28,17.5 28,17.5 Z"
      fill="#f5b723"
    />
  </g>

  <!-- Tipografia Oficial Combustível Certo -->
  <text x="88" y="55" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="27" font-weight="900" letter-spacing="-0.5">
    <tspan fill="#ffffff">Combustível</tspan>
    <tspan fill="#f5b723" dx="7">Certo</tspan>
  </text>
</svg>
